<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About Me</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            color: #333;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #1e3c72;
        }

        .profile-img {
            width: 150px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: 4px solid #1e3c72;
            margin: 20px 0;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .skills {
            margin-top: 20px;
        }

        .skills span {
            display: inline-block;
            background: #1e3c72;
            color: white;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>About Me</h1>

    <!-- Passport Size Image (Replace Later) -->
    <img src="m.jpg" alt="Profile Picture" class="profile-img">

    <p>
        I have completed <strong>Bachelor of Science in Mathematics (B's Mathematics)</strong> 
        and also completed <strong>D.I.T (Diploma in Information Technology)</strong>.
        I am a professional Website Designer with strong skills in HTML, CSS, and modern web design.
    </p>

    <div class="skills">
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
        <span>Website Design</span>
        <span>Mathematics</span>
    </div>

</div>

</body>
</html>
